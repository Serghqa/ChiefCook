{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}

<h2>
    <a href="{% url 'index' %}">На главную</a>
</h2>

<h3>{{ category_name }}</h3>

<ul>
    {% for recipe_id, recipe in recipes.items %}
        <li>
            <a href="{% url 'recipe' category recipe_id %}">
                {{ recipe.name }}
            </a>
        </li>
    {% endfor %}
</ul>

{% endblock %}
