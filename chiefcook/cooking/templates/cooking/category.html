{% extends 'base.html' %}

{% block title %}{{ meal_type.get_name_display }}{% endblock %}

{% block content %}

<h2>
    <a href="{% url 'index' %}">На главную</a>
</h2>

<h3>{{ meal_type.get_name_display }}</h3>

<ul>
    {% for recipe in recipes %}
        <li>
            <a href="{% url 'recipe' meal_type.name recipe.id %}">
                {{ recipe.name }}
            </a>
        </li>
    {% endfor %}
</ul>

{% endblock %}
