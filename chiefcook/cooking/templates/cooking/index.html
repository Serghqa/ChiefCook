{% extends 'base.html' %}

{% block content %}

<h1>
    <a href="{% url 'index' %}">🍳 Кулинарные рецепты</a>
</h1>

<div class='categories_container'>
    {% for category in categories %}
        <h2 class='category_item'>
            <a href="{% url 'category' category.name %}">{{ category.get_name_display }}</a>
        </h2>
    {% endfor %}
</div>

{% endblock %}
