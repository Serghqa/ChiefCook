<form method=""
    <div class="cards-container">
        {% for recipe in recipes %}
            <div class="card">
                <a href="{{ recipe.get_absolute_url }}" class="card-title">{{ recipe.name }}</a>
                <div class="card-subtitle">Кухня: {{ recipe.cuisine.name }}</div>
                <div class="card-subtitle">Автор: {{ recipe.author.user.username }}</div>
                <div class="card-subtitle">Категория: {{ recipe.category.name }}</div>
            </div>
        {% endfor %}
    </div>
