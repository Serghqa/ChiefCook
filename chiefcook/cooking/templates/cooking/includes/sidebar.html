<h4>Категории</h4>
<nav class="sidebar-nav">
    {% if categories %}
        {% for category in categories %}
            <a href="{{ category.get_absolute_url }}">{{ category.name }}</a>
        {% endfor %}
    {% endif %}
</nav>
<h4>Кухни</h4>
<nav class="sidebar-nav">
    {% if cuisines %}
        {% for cuisine in cuisines %}<a href="{{ cuisine.get_absolute_url }}">{{ cuisine.name }}</a>{% endfor %}
    {% endif %}
</nav>
<h4>Теги</h4>
<nav class="sidebar-nav">
    {% if tags %}
        {% for tag in tags %}<a href="{{ tag.get_absolute_url }}">{{ tag.name }}</a>{% endfor %}
    {% endif %}
</nav>
