{% extends "base.html" %}

{% block title %}{{ recipe.name }}{% endblock %}

{% block content %}

<h2>
    <a href="{% url 'index' %}">На главную</a>
</h2>

<h3>{{ recipe.name }}</h3>

<p>Кухня: {{ recipe.cuisine }}</p>

<ul>
    {% for ingredient in recipe.ingredients %}
        <li>{{ ingredient }}</li>
    {% endfor %}
</ul>

<p>{{ recipe.instructions }}</p>

<h3>
    <a href="{% url 'category' category %}">Назад</a>
</h3>

{% endblock %}
