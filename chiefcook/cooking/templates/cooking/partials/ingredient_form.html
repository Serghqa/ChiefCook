<div class="ingredient-form">
    {% for field in form %}
        {% if field.name != "id" and field.name != "recipe" %}
            <div class="field-wrapper">
                {{ field.label_tag }} {{ field }}
            </div>
            <div class="error">
                {{ field.errors }}
            </div>
        {% endif %}
    {% endfor %}
    <button type="button" class="btn-remove-ingredient">Удалить</button>
</div>
