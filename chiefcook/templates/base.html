{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
            Мои Вкусные Рецепты
        {% endblock %}
    </title>
    <link type='text/css' href="{% static 'cooking/css/styles.css' %}" rel='stylesheet'>
</head>
<body>

<header class='main_header'>
    <div class='header_container'>
        <a href="{% url 'index' %}" class='logo'>
            <img src="{% static 'cooking/images/logo.png' %}" alt='Логотип' class='logo_img'>
            <span>Мои рецепты</span>
        </a>
        <nav class='nav_menu'>
            <a href="{% url 'index' %}">Главная</a>
            <a href="{% url 'index' %}">Зарегистрироваться</a>
            <a href="{% url 'index' %}">Войти</a>
        </nav>
    </div>
</header>

<main>
    {% block content %}
    <!-- Сюда будет подставляться содержимое страниц -->
    {% endblock %}
</main>

<footer class='main_footer'>
    <div class='footer_container'>
        <div class='footer_content'>
            <span class='footer_logo'>Мои рецепты</span>
            <p class='footer_copy'>&copy; {% now "Y" %} Мои Рецепты. Сделано с любовью.</p>
        </div>
    </div>
</footer>

</body>
</html>
