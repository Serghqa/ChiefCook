{% csrf_token %}
{% if form.non_field_errors %}
    <div class="user-errors">
        {{ form.non_field_errors }}
    </div>
{% endif %}
<div>
    {% if form.email.errors %}
        <div class="field-errors">{{ form.email.errors }}</div>
    {% endif %}
    <label for="{{ form.email.id_for_label }}">{{ form.email.label }}:</label>
    {{ form.email }}
</div>
