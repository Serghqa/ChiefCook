{% csrf_token %}
{% if form.non_field_errors %}
    <div class="user-errors">
        {{ form.non_field_errors }}
    </div>
{% endif %}
<div>
    {% for field in form %}
        <div>
            {% if field.errors %}
                <div class="field-errors">{{ field.errors }}</div>
            {% endif %}
                {{ field.label_tag }}
                {{ field }}
        </div>
    {% endfor %}
</div>
